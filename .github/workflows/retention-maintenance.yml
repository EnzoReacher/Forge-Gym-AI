name: Retention maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-retention-maintenance
  cancel-in-progress: false

jobs:
  purge-expired-audit-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Delete expired non-identifying audit markers
        env:
          FORGE_PRODUCTION_URL: ${{ secrets.FORGE_PRODUCTION_URL }}
          FORGE_MAINTENANCE_SECRET: ${{ secrets.FORGE_MAINTENANCE_SECRET }}
          FORGE_SITES_BYPASS_TOKEN: ${{ secrets.FORGE_SITES_BYPASS_TOKEN }}
        run: node scripts/retention-maintenance.mjs
