name: Source verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-source-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Reject credentials in tracked source
        run: npm run security:secrets

      - name: Check source quality
        run: npm run lint

      - name: Build and run deterministic tests
        run: npm test

      - name: Reject known production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
