name: Source verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: forge-source-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Use the supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Reject credentials in tracked source
        run: npm run security:secrets

      - name: Check source quality
        run: npm run lint

      - name: Build and run deterministic tests
        run: npm test

      - name: Reject known production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
